<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Toán Của Gấu" />
  <title>Toán Lớp 1 Của Gấu  </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; font-family: 'Nunito', sans-serif; background: #fdf2f8; padding-top: max(env(safe-area-inset-top), 6px); padding-bottom: max(env(safe-area-inset-bottom), 6px); padding-left: max(env(safe-area-inset-left), 6px); padding-right: max(env(safe-area-inset-right), 6px); }
    .btn-bounce { transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-bounce:active { transform: scale(0.88); }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes popIn { 0% { transform: scale(0.2); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-float { animation: floatSlow 2.5s ease-in-out infinite; }
    .animate-pop { animation: popIn 0.3s ease-out forwards; }
    .map-bg { background: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="%23dcfce7" opacity="0.4"/></svg>') #ecfdf5; background-size: 80px 80px; }
  </style>
</head>
<body class="flex flex-col justify-between h-full w-full max-w-5xl mx-auto gap-2">

  <!-- HEADER -->
  <header class="bg-white rounded-2xl shadow-sm border-2 border-pink-200 px-3 py-2 shrink-0 flex items-center justify-between gap-2 z-10">
    <div class="flex items-center gap-2">
      <button onclick="switchView('map')" class="w-10 h-10 rounded-xl bg-pink-100 border-2 border-pink-400 flex items-center justify-center text-xl shrink-0 btn-bounce">🐻</button>
      <div class="flex flex-col">
        <span class="text-[10px] font-black text-pink-500 uppercase">Hành trình của Gấu</span>
        <span id="current-station-name" class="text-sm sm:text-base font-black text-slate-800 leading-tight">Bản đồ Kho báu</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-amber-100 border-2 border-amber-300 px-3 py-1 rounded-xl shadow-inner">
        <span class="text-base">⭐</span><span id="star-score" class="text-base sm:text-lg font-black text-amber-700">0</span>
      </div>
      <button onclick="switchView('map')" class="btn-bounce bg-sky-500 text-white font-black text-xs sm:text-sm px-3 py-2 rounded-xl shadow-md border-b-2 border-sky-700">🗺️ Bản đồ</button>
    </div>
  </header>

  <!-- MÀN HÌNH CHÍNH CHỨA BẢN ĐỒ HOẶC MINI-GAME -->
  <main id="main-container" class="flex-1 min-h-0 w-full rounded-3xl shadow-inner border-4 border-white overflow-hidden relative flex flex-col"></main>

  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

  <script>
    const CHILD_NAME = 'Gấu';
    const state = {
      view: 'map', // 'map', 'match', 'compare'
      stars: parseInt(localStorage.getItem('toan1_stars') || '0', 10),
      currentQ: null
    };

    let audioCtx = null;
    function initAudio() {
      if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch(e){} }
      if (!audioCtx) audioCtx = new window.AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function forceWakeUpTTS() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const silent = new SpeechSynthesisUtterance(' '); silent.volume = 0;
        window.speechSynthesis.speak(silent);
      }
    }

    function speakVietnamese(text) {
      if (!text || !('speechSynthesis' in window)) return;
      initAudio(); window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'vi-VN'; utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }

    function playSound(type) {
      initAudio();
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'pop') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'success') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    /* =========================================================
       1. BẢN ĐỒ PHIÊU LƯU
       ========================================================= */
    function renderMap() {
      const container = document.getElementById('main-container');
      document.getElementById('current-station-name').textContent = 'Bản đồ Kho báu';
      container.className = 'flex-1 min-h-0 w-full rounded-3xl shadow-inner border-4 border-emerald-300 map-bg p-4 flex items-center justify-center relative overflow-hidden';
      
      container.innerHTML = `
        <div class="w-full max-w-sm flex flex-col gap-8 relative">
          <!-- Trạm 3 -->
          <button onclick="startCompareGame()" class="btn-bounce relative w-full bg-white border-4 border-amber-400 rounded-3xl p-3 shadow-lg flex items-center gap-3">
            <div class="w-14 h-14 rounded-2xl bg-amber-100 border-2 border-amber-400 flex items-center justify-center text-3xl shrink-0">⚖️</div>
            <div class="text-left">
              <div class="text-xs font-black text-amber-500 uppercase">Trạm 3 • SGK Trang 24</div>
              <div class="text-lg font-black text-slate-800">Đỉnh Núi So Sánh</div>
            </div>
            <span class="absolute -top-3 -right-3 bg-rose-500 text-white text-xs font-black px-2 py-1 rounded-full animate-pop">Mới!</span>
          </button>
          
          <div class="w-2 h-10 bg-emerald-400 mx-auto border-l-4 border-dashed border-white opacity-60"></div>

          <!-- Trạm 2 -->
          <button onclick="startMatchGame()" class="btn-bounce relative w-full bg-white border-4 border-sky-400 rounded-3xl p-3 shadow-lg flex items-center gap-3">
            <div class="w-14 h-14 rounded-2xl bg-sky-100 border-2 border-sky-400 flex items-center justify-center text-3xl shrink-0">🐰</div>
            <div class="text-left">
              <div class="text-xs font-black text-sky-500 uppercase">Trạm 2 • SGK Trang 20</div>
              <div class="text-lg font-black text-slate-800">Suối Ghép Đôi</div>
            </div>
          </button>

          <div class="w-2 h-10 bg-emerald-400 mx-auto border-l-4 border-dashed border-white opacity-60"></div>

          <!-- Trạm 1 (Đã hoàn thành) -->
          <div class="relative w-full bg-emerald-50 border-4 border-emerald-300 rounded-3xl p-3 shadow opacity-80 flex items-center gap-3">
            <div class="w-14 h-14 rounded-2xl bg-emerald-200 border-2 border-emerald-500 flex items-center justify-center text-3xl shrink-0">🐾</div>
            <div class="text-left">
              <div class="text-xs font-black text-emerald-600 uppercase">Trạm 1 (Đã qua)</div>
              <div class="text-lg font-black text-slate-700">Rừng Đếm Số</div>
            </div>
            <span class="absolute -top-3 -right-3 text-2xl">✅</span>
          </div>
        </div>
      `;
      speakVietnamese(`${CHILD_NAME} ơi, mình đi tới Trạm Suối Ghép Đôi hay Đỉnh Núi So Sánh nào?`);
    }

    /* =========================================================
       2. TRẠM SUỐI GHÉP ĐÔI (NHIỀU HƠN / ÍT HƠN) - BÀI 3
       ========================================================= */
    function startMatchGame() {
      forceWakeUpTTS();
      state.view = 'match';
      const pets = Math.floor(Math.random() * 4) + 2; // 2 to 5
      const foods = Math.floor(Math.random() * 4) + 2;
      let answer = 'bằng nhau';
      if (pets > foods) answer = 'nhiều hơn';
      if (pets < foods) answer = 'ít hơn';

      state.currentQ = { pets, foods, answer, matched: 0 };
      document.getElementById('current-station-name').textContent = 'Suối Ghép Đôi';
      renderMatchGame();
      setTimeout(() => speakVietnamese(`${CHILD_NAME} ơi, cho mỗi bạn Thỏ một củ cà rốt, rồi xem bên nào nhiều hơn nhé!`), 400);
    }

    function renderMatchGame() {
      const container = document.getElementById('main-container');
      const q = state.currentQ;
      
      container.className = 'flex-1 min-h-0 w-full rounded-3xl shadow-inner border-4 border-sky-300 bg-gradient-to-b from-sky-50 to-blue-100 p-2 flex flex-col';
      
      const allMatched = (q.matched === Math.min(q.pets, q.foods));

      container.innerHTML = `
        <div class="bg-white rounded-2xl p-3 shadow border-2 border-sky-200 text-center shrink-0">
          <div class="text-sm sm:text-lg font-black text-slate-800">Chạm vào củ cà rốt để chia cho các bạn Thỏ nhé!</div>
        </div>
        
        <div class="flex-1 flex flex-row items-center justify-around mt-4">
          <!-- Cột Thỏ -->
          <div class="flex flex-col gap-2">
            ${Array(q.pets).fill(0).map((_, i) => `
              <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-2xl border-4 border-pink-200 shadow-md flex items-center justify-center text-4xl relative transition-all ${i < q.matched ? 'bg-emerald-100 border-emerald-400' : ''}">
                🐰
                ${i < q.matched ? '<span class="absolute -bottom-2 -right-2 text-2xl animate-pop">🥕</span>' : ''}
              </div>
            `).join('')}
          </div>

          <!-- Cột Cà rốt -->
          <div class="flex flex-col gap-2">
            ${Array(q.foods).fill(0).map((_, i) => `
              <button onclick="feedRabbit()" class="btn-bounce w-16 h-16 sm:w-20 sm:h-20 rounded-2xl border-4 shadow-md flex items-center justify-center text-4xl transition-all ${i < q.matched ? 'opacity-0 scale-50 pointer-events-none' : 'bg-white border-orange-300 hover:bg-orange-50'}">
                🥕
              </button>
            `).join('')}
          </div>
        </div>

        <!-- Khung Trả lời hiện lên khi chia xong -->
        <div id="match-answer-box" class="w-full bg-white p-3 rounded-2xl shadow-lg border-t-4 border-sky-400 transition-all ${allMatched ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}">
          <div class="text-center font-black text-base sm:text-xl text-slate-800 mb-3">Số bạn Thỏ <span>___</span> số Cà rốt?</div>
          <div class="flex justify-center gap-2">
            <button onclick="checkMatch('nhiều hơn')" class="btn-bounce flex-1 bg-pink-100 border-2 border-pink-400 text-pink-700 font-black py-3 rounded-xl text-sm sm:text-lg">Nhiều hơn</button>
            <button onclick="checkMatch('bằng nhau')" class="btn-bounce flex-1 bg-sky-100 border-2 border-sky-400 text-sky-700 font-black py-3 rounded-xl text-sm sm:text-lg">Bằng nhau</button>
            <button onclick="checkMatch('ít hơn')" class="btn-bounce flex-1 bg-emerald-100 border-2 border-emerald-400 text-emerald-700 font-black py-3 rounded-xl text-sm sm:text-lg">Ít hơn</button>
          </div>
        </div>
      `;

      if (allMatched && !q.asked) {
        q.asked = true;
        speakVietnamese(`Đã chia xong! ${CHILD_NAME} nhìn xem, số bạn thỏ nhiều hơn, ít hơn, hay bằng số cà rốt?`);
      }
    }

    window.feedRabbit = function() {
      const q = state.currentQ;
      if (q.matched < q.pets && q.matched < q.foods) {
        playSound('pop');
        q.matched++;
        renderMatchGame();
      }
    };

    window.checkMatch = function(userAns) {
      if (userAns === state.currentQ.answer) {
        playSound('success'); triggerConfetti();
        state.stars++; localStorage.setItem('toan1_stars', state.stars); document.getElementById('star-score').textContent = state.stars;
        speakVietnamese(`Giỏi quá! Số thỏ ${userAns} số cà rốt.`);
        setTimeout(() => startMatchGame(), 2000);
      } else {
        playSound('wrong');
        speakVietnamese(`Chưa đúng rồi, ${CHILD_NAME} nhìn kỹ xem bên nào bị thừa ra nhé!`);
      }
    };

    /* =========================================================
       3. TRẠM ĐỈNH NÚI SO SÁNH (>, <, =) - BÀI 4
       ========================================================= */
    function startCompareGame() {
      forceWakeUpTTS();
      state.view = 'compare';
      const num1 = Math.floor(Math.random() * 10);
      const num2 = Math.floor(Math.random() * 10);
      let answer = '=';
      if (num1 > num2) answer = '>';
      if (num1 < num2) answer = '<';

      state.currentQ = { num1, num2, answer };
      document.getElementById('current-station-name').textContent = 'Đỉnh Núi So Sánh';
      renderCompareGame();
      setTimeout(() => speakVietnamese(`${CHILD_NAME} ơi, số ${num1} lớn hơn, bé hơn hay bằng số ${num2}?`), 400);
    }

    function renderCompareGame() {
      const container = document.getElementById('main-container');
      const q = state.currentQ;
      
      container.className = 'flex-1 min-h-0 w-full rounded-3xl shadow-inner border-4 border-amber-300 bg-gradient-to-b from-amber-50 to-orange-100 p-3 flex flex-col justify-center items-center';
      
      container.innerHTML = `
        <!-- Mô phỏng xe tải chở số SGK trang 24 -->
        <div class="bg-white rounded-3xl p-5 shadow-lg border-4 border-amber-400 w-full max-w-sm flex items-center justify-between animate-pop mb-10">
          <div class="w-20 h-24 bg-pink-100 border-4 border-pink-400 rounded-2xl flex items-center justify-center text-5xl font-black text-pink-700 shadow-inner">
            ${q.num1}
          </div>
          
          <div class="w-16 h-16 bg-slate-100 border-4 border-dashed border-slate-400 rounded-2xl flex items-center justify-center text-4xl font-black text-slate-300">
            ?
          </div>

          <div class="w-20 h-24 bg-sky-100 border-4 border-sky-400 rounded-2xl flex items-center justify-center text-5xl font-black text-sky-700 shadow-inner">
            ${q.num2}
          </div>
        </div>

        <div class="w-full max-w-sm">
          <div class="text-center font-black text-amber-700 mb-3">Chọn dấu đúng thả vào ô trống:</div>
          <div class="flex justify-center gap-3">
            <button onclick="checkCompare('>')" class="btn-bounce w-20 h-20 bg-rose-500 text-white border-b-4 border-rose-700 rounded-2xl font-black text-4xl shadow-md flex items-center justify-center">></button>
            <button onclick="checkCompare('=')" class="btn-bounce w-20 h-20 bg-emerald-500 text-white border-b-4 border-emerald-700 rounded-2xl font-black text-4xl shadow-md flex items-center justify-center">=</button>
            <button onclick="checkCompare('<')" class="btn-bounce w-20 h-20 bg-blue-500 text-white border-b-4 border-blue-700 rounded-2xl font-black text-4xl shadow-md flex items-center justify-center"><</button>
          </div>
        </div>
      `;
    }

    window.checkCompare = function(userAns) {
      if (userAns === state.currentQ.answer) {
        playSound('success'); triggerConfetti();
        state.stars++; localStorage.setItem('toan1_stars', state.stars); document.getElementById('star-score').textContent = state.stars;
        let word = userAns === '>' ? 'lớn hơn' : userAns === '<' ? 'bé hơn' : 'bằng';
        speakVietnamese(`Chính xác! Số ${state.currentQ.num1} ${word} số ${state.currentQ.num2}.`);
        setTimeout(() => startCompareGame(), 2000);
      } else {
        playSound('wrong');
        speakVietnamese(`Chưa đúng rồi Gấu ơi, thử lại nhé!`);
      }
    };

    /* =========================================================
       4. ĐIỀU HƯỚNG & PHÁO HOA
       ========================================================= */
    window.switchView = function(view) {
      playSound('pop');
      if (view === 'map') renderMap();
    };

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas'); const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const pieces = Array.from({length: 40}, () => ({ x: canvas.width/2, y: canvas.height/2, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.8)*15, size: Math.random()*8+6, color: ['#ec4899','#f59e0b','#8b5cf6','#10b981','#3b82f6'][Math.floor(Math.random()*5)] }));
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.5; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
        if (++frame < 35) requestAnimationFrame(animate); else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    renderMap();
  </script>
</body>
</html>
