<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Toán 1 Thú Cưng" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/616/616430.png" />
  <title>Toán 1 - Thị Trấn Thú Cưng v3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Xóa toàn bộ cache cũ đang làm kẹt giao diện v1.0 trên iPhone
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.update());
      });
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      font-family: 'Nunito', sans-serif;
      background: #fdf2f8;
      padding-top: max(env(safe-area-inset-top), 6px);
      padding-bottom: max(env(safe-area-inset-bottom), 6px);
      padding-left: max(env(safe-area-inset-left), 6px);
      padding-right: max(env(safe-area-inset-right), 6px);
    }
    .btn-bounce {
      transition: transform 0.1s ease;
    }
    .btn-bounce:active {
      transform: scale(0.88);
    }
    @keyframes popIn {
      0% { transform: scale(0.2); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-pop {
      animation: popIn 0.25s ease-out forwards;
    }
    .animate-float {
      animation: floatSlow 2.2s ease-in-out infinite;
    }
    .park-bg {
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 32%, #bbf7d0 32%, #86efac 100%);
    }
    .ten-frame-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
  </style>
</head>
<body class="flex flex-col justify-between h-full w-full max-w-5xl mx-auto gap-1.5">

  <!-- MÀN HÌNH BẮT ĐẦU (MỞ KHÓA LOA TRÊN IPHONE / IPAD) -->
  <div id="welcome-overlay" class="fixed inset-0 z-50 bg-gradient-to-b from-pink-500 via-rose-500 to-purple-600 flex flex-col items-center justify-center p-5 text-center text-white">
    <div class="w-24 h-24 rounded-3xl bg-white flex items-center justify-center text-6xl shadow-2xl mb-3 animate-float">
      🐱
    </div>
    <span class="bg-white/20 px-3 py-0.5 rounded-full text-xs font-black uppercase tracking-wider mb-1">
      Phiên bản v3.0 • Đã bật Giọng đọc Tiếng Việt
    </span>
    <h1 class="text-2xl sm:text-4xl font-black mb-1">THỊ TRẤN THÚ CƯNG</h1>
    <p class="text-sm sm:text-base font-bold text-pink-100 max-w-md mb-5">
      Toán Lớp 1 – Kết nối tri thức với cuộc sống
    </p>
    <button onclick="startAppWithAudio()" class="btn-bounce bg-amber-400 text-amber-950 font-black text-xl sm:text-2xl px-8 py-3.5 rounded-2xl shadow-xl border-b-4 border-amber-600 flex items-center gap-2">
      <span>▶️ BẤM VÀO ĐÂY ĐỂ BẮT ĐẦU</span>
      <span>🔊</span>
    </button>
  </div>

  <!-- 1. THANH ĐIỀU HƯỚNG SIÊU GỌN (1 HÀNG DUY NHẤT) -->
  <header class="bg-white rounded-xl shadow-sm border border-pink-200 px-2 py-1 shrink-0 flex items-center justify-between gap-1">
    <!-- 4 Nút Chế độ học -->
    <div class="flex items-center gap-1 overflow-x-auto">
      <button onclick="switchMode('count')" id="tab-count" class="btn-bounce px-2.5 py-1 rounded-lg font-black text-xs sm:text-sm bg-pink-500 text-white shadow shrink-0">
        🐾 Đếm Số
      </button>
      <button onclick="switchMode('tenframe')" id="tab-tenframe" class="btn-bounce px-2.5 py-1 rounded-lg font-black text-xs sm:text-sm text-pink-700 bg-pink-50 shrink-0">
        🍱 Khay 10
      </button>
      <button onclick="switchMode('bond')" id="tab-bond" class="btn-bounce px-2.5 py-1 rounded-lg font-black text-xs sm:text-sm text-pink-700 bg-pink-50 shrink-0">
        🌸 Tách-Gộp
      </button>
      <button onclick="switchMode('pets')" id="tab-pets" class="btn-bounce px-2.5 py-1 rounded-lg font-black text-xs sm:text-sm text-purple-700 bg-purple-50 shrink-0">
        🏡 Thú (<span id="pet-count-badge">1</span>/8)
      </button>
    </div>

    <!-- Điểm sao & Nút Đọc Câu Hỏi -->
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="flex items-center gap-1 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-lg">
        <span class="text-sm">⭐</span>
        <span id="star-score" class="text-sm font-black text-amber-700">0</span>
      </div>
      <button onclick="speakCurrentPrompt()" class="btn-bounce bg-sky-500 text-white font-black text-xs px-2.5 py-1 rounded-lg shadow flex items-center gap-1">
        <span>🔊</span>
        <span class="hidden sm:inline">Đọc đề</span>
      </button>
    </div>
  </header>

  <!-- 2. THANH CÂU HỎI (BẤM VÀO LÀ ĐỌC TO) -->
  <div onclick="speakCurrentPrompt()" class="btn-bounce cursor-pointer bg-white rounded-xl border-2 border-pink-300 px-2.5 py-1.5 shrink-0 flex items-center justify-between gap-2 shadow-sm">
    <div class="flex items-center gap-2 min-w-0">
      <span class="w-8 h-8 rounded-lg bg-sky-100 border border-sky-300 flex items-center justify-center text-lg shrink-0">🔊</span>
      <div class="min-w-0">
        <div id="sgk-badge" class="text-[10px] font-extrabold text-pink-600 uppercase leading-none">SGK Bài 1 • Trang 8</div>
        <h2 id="question-title" class="text-xs sm:text-base md:text-lg font-black text-slate-800 leading-tight truncate">
          Có bao nhiêu bạn Mèo Miu trong công viên?
        </h2>
      </div>
    </div>
    <button onclick="event.stopPropagation(); nextQuestion();" class="btn-bounce bg-slate-100 text-slate-600 font-extrabold text-xs px-2 py-1 rounded-lg shrink-0">
      Đổi ↻
    </button>
  </div>

  <!-- 3. SÂN CHƠI HÌNH ẢNH TRỰC QUAN (CHIẾM 70% DIỆN TÍCH MÀN HÌNH) -->
  <main id="stage-container" class="flex-1 min-h-0 w-full rounded-2xl shadow-inner border-2 border-white overflow-hidden relative flex flex-col">
    <!-- Render động các con vật, khay 10 ô, sơ đồ tách gộp -->
  </main>

  <!-- 4. BÀN PHÍM SỐ GỌN Ở ĐÁY (KHÔNG BAO GIỜ CHE MẤT HÌNH ẢNH) -->
  <footer id="numpad-panel" class="bg-white rounded-xl shadow border border-purple-200 p-1.5 shrink-0">
    <div class="flex items-center justify-between px-1 mb-1 text-[11px] font-extrabold text-slate-600">
      <span id="feedback-text" class="truncate">💡 Chạm vào từng bạn thú cưng để nghe đếm nhé!</span>
      <span id="reward-progress-text" class="text-purple-700 shrink-0 ml-2">Quà: 0/5 ⭐</span>
    </div>
    <div id="numpad-grid" class="grid grid-cols-6 sm:grid-cols-11 gap-1">
      <!-- Các nút số từ 0 đến 10 -->
    </div>
  </footer>

  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

  <script>
    /********************************************************************
     * 1. DỮ LIỆU THÚ CƯNG & TRẠNG THÁI
     ********************************************************************/
    const PET_CATALOG = [
      { id: 'cat', emoji: '🐱', name: 'Mèo Miu', food: '🐟', unlockedAt: 0 },
      { id: 'dog', emoji: '🐶', name: 'Cún Bông', food: '🦴', unlockedAt: 5 },
      { id: 'bunny', emoji: '🐰', name: 'Thỏ Trắng', food: '🥕', unlockedAt: 10 },
      { id: 'duck', emoji: '🐥', name: 'Vịt Nhỏ', food: '🌽', unlockedAt: 15 },
      { id: 'hamster', emoji: '🐹', name: 'Hamster', food: '🌻', unlockedAt: 20 },
      { id: 'panda', emoji: '🐼', name: 'Gấu Trúc', food: '🎋', unlockedAt: 25 },
      { id: 'fox', emoji: '🦊', name: 'Cáo Đỏ', food: '🍓', unlockedAt: 30 },
      { id: 'unicorn', emoji: '🦄', name: 'Kỳ Lân', food: '🧁', unlockedAt: 35 }
    ];

    const WORDS_VI = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín', 'mười'];

    const state = {
      mode: 'count',
      stars: parseInt(localStorage.getItem('toan1_stars') || '0', 10),
      streak: 0,
      currentQuestion: null,
      countedIndices: new Set(),
      userAddedCount: 0,
      audioUnlocked: false
    };

    /********************************************************************
     * 2. ĐỘNG CƠ GIỌNG ĐỌC TIẾNG VIỆT KÉP (CHẠY TRÊN MỌI IPHONE / IPAD)
     ********************************************************************/
    let audioCtx = null;
    const ttsPlayer = new Audio();
    ttsPlayer.referrerPolicy = 'no-referrer';

    function initAudio() {
      if (navigator.audioSession) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
      }
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function speakVietnamese(text) {
      initAudio();
      // Lớp 1: Phát giọng đọc Tiếng Việt chuẩn qua luồng Audio (hoạt động ngay cả khi iPhone chưa cài giọng Tiếng Việt)
      const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=vi&q=${encodeURIComponent(text)}`;
      ttsPlayer.pause();
      ttsPlayer.src = url;
      ttsPlayer.play().catch(() => {
        // Lớp 2 (Dự phòng khi tắt Wi-Fi): Dùng bộ đọc nội bộ của iOS
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'vi-VN';
          utter.rate = 0.92;
          window.speechSynthesis.speak(utter);
        }
      });
    }

    function speakCurrentPrompt() {
      if (state.currentQuestion && state.currentQuestion.voicePrompt) {
        speakVietnamese(state.currentQuestion.voicePrompt);
      }
    }

    function startAppWithAudio() {
      state.audioUnlocked = true;
      initAudio();
      document.getElementById('welcome-overlay').classList.add('hidden');
      playSuccessSound();
      setTimeout(() => speakCurrentPrompt(), 300);
    }

    const SCALE_FREQS = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 783.99];
    function playNote(index) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(SCALE_FREQS[index % SCALE_FREQS.length], audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    function playSuccessSound() {
      initAudio();
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }, idx * 80);
      });
    }

    function playGentleRetrySound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(185, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    /********************************************************************
     * 3. BỘ SINH CÂU HỎI BÁM SÁT SGK TOÁN 1 TẬP 1
     ********************************************************************/
    function getUnlockedPets() {
      return PET_CATALOG.filter(p => state.stars >= p.unlockedAt);
    }

    function pickRandomPet() {
      const unlocked = getUnlockedPets();
      return unlocked[Math.floor(Math.random() * unlocked.length)];
    }

    function generateQuestion() {
      state.countedIndices.clear();
      state.userAddedCount = 0;
      const pet = pickRandomPet();
      const maxRange = state.stars >= 4 || state.streak >= 3 ? 10 : 5;

      if (state.mode === 'count') {
        const target = Math.floor(Math.random() * (maxRange + 1));
        state.currentQuestion = {
          type: 'count',
          pet,
          target,
          answer: target,
          sgkRef: target <= 5 ? 'SGK Bài 1 (Trang 8–13)' : 'SGK Bài 2 (Trang 14–18)',
          title: `Có bao nhiêu bạn ${pet.name} trên bãi cỏ?`,
          voicePrompt: `Có bao nhiêu bạn ${pet.name} trên bãi cỏ? Bé hãy chạm vào từng bạn để đếm nhé!`
        };
      } else if (state.mode === 'tenframe') {
        const target = Math.floor(Math.random() * 5) + 6;
        const initial = Math.floor(Math.random() * (target - 2)) + 2;
        const needed = target - initial;
        state.currentQuestion = {
          type: 'tenframe',
          pet,
          initial,
          target,
          answer: needed,
          sgkRef: 'SGK Bài 2 (Trang 18 • Khay 10 ô)',
          title: `Đã có ${initial} ${pet.emoji}. Cần thêm mấy ${pet.emoji} để đủ ${target}?`,
          voicePrompt: `Trong khay đã có ${initial} bạn ${pet.name}. Cần cho thêm mấy bạn nữa để trong khay có đủ ${target} bạn?`
        };
      } else if (state.mode === 'bond') {
        const total = Math.floor(Math.random() * (maxRange - 2)) + 3;
        const left = Math.floor(Math.random() * (total - 1)) + 1;
        const right = total - left;
        const askTotal = Math.random() < 0.45;
        state.currentQuestion = {
          type: 'bond',
          pet,
          total,
          left,
          right,
          askTotal,
          answer: askTotal ? total : right,
          sgkRef: 'SGK Bài 5: Mấy và mấy (Trang 32–36)',
          title: askTotal
            ? `Giỏ Hồng có ${left} ${pet.emoji}, giỏ Xanh có ${right} ${pet.emoji}. Gộp lại được mấy?`
            : `Có ${total} ${pet.emoji} gồm ${left} ở giỏ Hồng và mấy ở giỏ Xanh?`,
          voicePrompt: askTotal
            ? `Giỏ hồng có ${left} bạn, giỏ xanh có ${right} bạn. Hỏi ${left} và ${right} được mấy?`
            : `Có ${total} bạn ${pet.name}, gồm ${left} bạn ở giỏ hồng và mấy bạn ở giỏ xanh?`
        };
      }

      renderWorkspace();
      if (state.audioUnlocked && state.mode !== 'pets') {
        setTimeout(() => speakCurrentPrompt(), 250);
      }
    }

    /********************************************************************
     * 4. HIỂN THỊ TRỰC QUAN TRÊN MỌI KÍCH THƯỚC MÀN HÌNH
     ********************************************************************/
    function renderNumpad() {
      const grid = document.getElementById('numpad-grid');
      grid.innerHTML = '';
      for (let num = 0; num <= 10; num++) {
        const btn = document.createElement('button');
        btn.className = `btn-bounce h-10 sm:h-12 rounded-xl font-black text-lg sm:text-2xl shadow-sm border-b-2 flex items-center justify-center ${
          num === 10
            ? 'col-span-2 sm:col-span-1 bg-purple-600 text-white border-purple-800'
            : num === 0
            ? 'bg-amber-400 text-amber-950 border-amber-600'
            : 'bg-pink-50 active:bg-pink-200 text-pink-700 border-pink-300'
        }`;
        btn.textContent = num;
        btn.onclick = () => handleAnswerSubmit(num);
        grid.appendChild(btn);
      }
    }

    function renderWorkspace() {
      document.getElementById('star-score').textContent = state.stars;
      document.getElementById('pet-count-badge').textContent = getUnlockedPets().length;
      document.getElementById('reward-progress-text').textContent = `Quà: ${state.stars % 5}/5 ⭐`;

      const stage = document.getElementById('stage-container');
      const numpadPanel = document.getElementById('numpad-panel');

      if (state.mode === 'pets') {
        numpadPanel.classList.add('hidden');
        renderPetSanctuary(stage);
        return;
      }

      numpadPanel.classList.remove('hidden');
      const q = state.currentQuestion;
      document.getElementById('sgk-badge').textContent = `${q.sgkRef} • Chuỗi thắng: ${state.streak} 🔥`;
      document.getElementById('question-title').textContent = q.title;

      if (q.type === 'count') renderCountStage(stage, q);
      else if (q.type === 'tenframe') renderTenFrameStage(stage, q);
      else if (q.type === 'bond') renderBondStage(stage, q);
    }

    // MÀN HÌNH 1: ĐẾM THÚ CƯNG TRÊN BÃI CỎ
    function renderCountStage(stage, q) {
      stage.className = 'flex-1 min-h-0 w-full rounded-2xl shadow-inner border-2 border-emerald-300 overflow-hidden relative flex flex-col justify-between park-bg p-2';

      const topDecor = document.createElement('div');
      topDecor.className = 'flex items-center justify-between px-2 shrink-0';
      topDecor.innerHTML = `
        <span class="bg-white/90 text-sky-900 font-black text-xs px-2.5 py-0.5 rounded-full shadow-sm">
          ☁️ Đã chạm đếm: <b class="text-pink-600 text-sm">${state.countedIndices.size}</b>
        </span>
        <span class="text-xl">☀️ 🦋</span>
      `;
      stage.innerHTML = '';
      stage.appendChild(topDecor);

      const grass = document.createElement('div');
      grass.className = 'flex-1 flex flex-wrap items-center justify-center content-center gap-2 sm:gap-3.5 p-1 overflow-y-auto';

      if (q.target === 0) {
        grass.innerHTML = `
          <div class="bg-white/95 rounded-2xl p-4 border-2 border-dashed border-emerald-500 text-center max-w-xs animate-pop shadow">
            <div class="text-5xl mb-1">🧺</div>
            <p class="text-sm sm:text-base font-black text-emerald-900">
              Bãi cỏ đang trống không! Có <b>0</b> bạn ${q.pet.name}.
            </p>
          </div>
        `;
      } else {
        for (let i = 0; i < q.target; i++) {
          const isCounted = state.countedIndices.has(i);
          const order = Array.from(state.countedIndices).indexOf(i) + 1;
          const card = document.createElement('button');
          card.className = `btn-bounce w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 rounded-2xl flex flex-col items-center justify-center relative shadow border-2 transition-all ${
            isCounted
              ? 'bg-pink-500 border-white text-white scale-105'
              : 'bg-white/95 border-emerald-400'
          }`;
          card.innerHTML = `
            <span class="text-3xl sm:text-4xl md:text-5xl ${isCounted ? '' : 'animate-float'}">${q.pet.emoji}</span>
            <span class="text-[10px] font-black leading-none mt-0.5 ${isCounted ? 'text-white' : 'text-slate-500'}">
              ${isCounted ? `Số ${order}` : 'Chạm'}
            </span>
            ${
              isCounted
                ? `<span class="absolute -top-2 -right-2 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-amber-400 text-amber-950 font-black text-xs sm:text-sm flex items-center justify-center shadow border border-white animate-pop">${order}</span>`
                : ''
            }
          `;
          card.onclick = () => {
            if (!state.countedIndices.has(i)) {
              state.countedIndices.add(i);
              const n = state.countedIndices.size;
              playNote(n - 1);
              speakVietnamese(WORDS_VI[n]);
              document.getElementById('feedback-text').textContent = `👏 Bé đếm được: ${n} bạn ${q.pet.name}!`;
              renderCountStage(stage, q);
            }
          };
          grass.appendChild(card);
        }
      }
      stage.appendChild(grass);

      const bottomFlowers = document.createElement('div');
      bottomFlowers.className = 'text-center text-[11px] font-black text-emerald-950 shrink-0';
      bottomFlowers.textContent = '🌷 Chạm vào từng bạn thú cưng để đếm rồi chọn số ở thanh dưới cùng nhé! 🌷';
      stage.appendChild(bottomFlowers);
    }

    // MÀN HÌNH 2: KHAY 10 Ô (TRANG 18 SGK)
    function renderTenFrameStage(stage, q) {
      stage.className = 'flex-1 min-h-0 w-full rounded-2xl shadow-inner border-2 border-amber-300 bg-amber-50 p-2 flex flex-col justify-between items-center overflow-hidden';
      const currentTotal = q.initial + state.userAddedCount;

      stage.innerHTML = `
        <div class="w-full flex items-center justify-between bg-white px-3 py-1 rounded-xl border border-amber-300 text-xs sm:text-sm font-black shrink-0">
          <span>Có sẵn: <b class="text-pink-600">${q.initial}</b> + Bé thêm: <b class="text-sky-600">${state.userAddedCount}</b></span>
          <span class="px-2 py-0.5 rounded-lg ${currentTotal === q.target ? 'bg-emerald-500 text-white' : 'bg-amber-100 text-amber-900'}">
            Tổng: ${currentTotal} / ${q.target}
          </span>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = 'ten-frame-grid w-full max-w-lg flex-1 my-1.5 bg-amber-200/80 p-2 rounded-xl border-2 border-amber-500';

      for (let i = 0; i < 10; i++) {
        const cell = document.createElement('button');
        const isInitial = i < q.initial;
        const isUserAdded = i >= q.initial && i < q.initial + state.userAddedCount;
        const isTargetSlot = i < q.target;

        cell.className = `btn-bounce rounded-xl border-2 flex flex-col items-center justify-center relative ${
          isInitial
            ? 'bg-pink-100 border-pink-400'
            : isUserAdded
            ? 'bg-sky-200 border-sky-600 shadow-sm'
            : isTargetSlot
            ? 'bg-white border-dashed border-rose-400'
            : 'bg-amber-100/50 border-amber-300/60 opacity-50'
        }`;

        if (isInitial) {
          cell.innerHTML = `<span class="text-2xl sm:text-4xl">${q.pet.emoji}</span>`;
        } else if (isUserAdded) {
          const addedNum = i - q.initial + 1;
          cell.innerHTML = `
            <span class="text-2xl sm:text-4xl animate-pop">${q.pet.emoji}</span>
            <span class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-sky-600 text-white font-black text-[10px] flex items-center justify-center">+${addedNum}</span>
          `;
          cell.onclick = () => {
            state.userAddedCount--;
            playNote(Math.max(0, state.userAddedCount));
            renderTenFrameStage(stage, q);
          };
        } else {
          cell.innerHTML = `<span class="text-[11px] font-black ${isTargetSlot ? 'text-rose-500' : 'text-amber-500'}">${isTargetSlot ? '+ Thêm' : ''}</span>`;
          cell.onclick = () => {
            if (q.initial + state.userAddedCount < 10) {
              state.userAddedCount++;
              playNote(state.userAddedCount - 1);
              speakVietnamese(WORDS_VI[state.userAddedCount]);
              renderTenFrameStage(stage, q);
            }
          };
        }
        grid.appendChild(cell);
      }
      stage.appendChild(grid);

      const foot = document.createElement('div');
      foot.className = 'text-[11px] font-black text-amber-900 text-center shrink-0';
      foot.innerHTML =
        currentTotal === q.target
          ? `✅ Đã đủ ${q.target}! Bé vừa thêm <b class="text-sky-700">${state.userAddedCount}</b> ô màu xanh, hãy bấm số <b class="text-rose-600">${state.userAddedCount}</b> ở dưới nhé!`
          : `👆 Chạm vào các ô "+ Thêm" cho đến khi đủ ${q.target} bạn nhé!`;
      stage.appendChild(foot);
    }

    // MÀN HÌNH 3: SƠ ĐỒ TÁCH - GỘP (TRANG 32-36 SGK)
    function renderBondStage(stage, q) {
      stage.className = 'flex-1 min-h-0 w-full rounded-2xl shadow-inner border-2 border-pink-300 bg-gradient-to-b from-pink-50 to-sky-50 p-2 flex flex-col justify-between items-center overflow-hidden';

      stage.innerHTML = `
        <div class="bg-white border border-pink-200 px-3 py-1 rounded-xl text-sm sm:text-lg font-black text-slate-800 shrink-0 shadow-sm">
          ${
            q.askTotal
              ? `<span class="text-pink-600">${q.left}</span> và <span class="text-sky-600">${q.right}</span> được <span class="px-2 py-0.5 rounded bg-rose-500 text-white">?</span>`
              : `<span class="text-purple-700">${q.total}</span> gồm <span class="text-pink-600">${q.left}</span> và <span class="px-2 py-0.5 rounded bg-rose-500 text-white">?</span>`
          }
        </div>

        <div class="flex-1 w-full grid grid-cols-12 gap-1.5 items-center my-1 min-h-0">
          <div class="col-span-4 h-full bg-pink-100/90 border-2 border-pink-400 rounded-xl p-1.5 flex flex-col items-center justify-between overflow-hidden">
            <span class="text-[11px] font-black text-pink-800">Giỏ Hồng (${q.left})</span>
            <div class="flex flex-wrap items-center justify-center gap-1 my-auto">
              ${Array(q.left).fill(`<span class="text-xl sm:text-3xl animate-pop">${q.pet.emoji}</span>`).join('')}
            </div>
          </div>

          <div class="col-span-4 flex items-center justify-center">
            <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-full bg-amber-100 border-4 border-sky-500 shadow flex flex-col items-center justify-between p-1.5">
              <div class="w-8 h-7 sm:w-10 sm:h-8 rounded bg-white border border-sky-600 flex items-center justify-center font-black text-sm sm:text-lg ${q.askTotal ? 'text-rose-600' : 'text-purple-800'}">
                ${q.askTotal ? '?' : q.total}
              </div>
              <div class="w-full border-t border-sky-400"></div>
              <div class="flex items-center justify-around w-full">
                <div class="w-7 h-6 sm:w-9 sm:h-8 rounded bg-pink-200 border border-pink-500 flex items-center justify-center font-black text-xs sm:text-base text-pink-900">
                  ${q.left}
                </div>
                <div class="w-7 h-6 sm:w-9 sm:h-8 rounded bg-sky-200 border border-sky-500 flex items-center justify-center font-black text-xs sm:text-base ${!q.askTotal ? 'text-rose-600' : 'text-sky-900'}">
                  ${!q.askTotal ? '?' : q.right}
                </div>
              </div>
            </div>
          </div>

          <div class="col-span-4 h-full bg-sky-100/90 border-2 border-sky-400 rounded-xl p-1.5 flex flex-col items-center justify-between overflow-hidden">
            <span class="text-[11px] font-black text-sky-800">Giỏ Xanh (${q.askTotal ? q.right : '?'})</span>
            <div class="flex flex-wrap items-center justify-center gap-1 my-auto">
              ${Array(q.right).fill(`<span class="text-xl sm:text-3xl animate-pop">${q.pet.emoji}</span>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // MÀN HÌNH 4: BỘ SƯU TẬP THÚ CƯNG
    function renderPetSanctuary(stage) {
      stage.className = 'flex-1 min-h-0 w-full rounded-2xl border-2 border-purple-300 bg-white p-2 overflow-y-auto';
      document.getElementById('question-title').textContent = 'Bộ Sưu Tập Thú Cưng (Chạm vào thú cưng để nghe chào!)';

      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-2 sm:grid-cols-4 gap-2';
      PET_CATALOG.forEach(pet => {
        const unlocked = state.stars >= pet.unlockedAt;
        const card = document.createElement('button');
        card.className = `btn-bounce rounded-xl p-2 border-2 flex flex-col items-center text-center ${
          unlocked ? 'bg-pink-50 border-pink-300' : 'bg-slate-100 border-slate-300 opacity-60'
        }`;
        card.innerHTML = `
          <div class="text-3xl sm:text-4xl">${unlocked ? pet.emoji : '🔒'}</div>
          <div class="font-black text-xs text-slate-800 mt-1">${pet.name}</div>
          <div class="text-[10px] font-bold text-slate-500">${unlocked ? `Món ăn: ${pet.food}` : `Mở ở ${pet.unlockedAt} ⭐`}</div>
        `;
        if (unlocked) {
          card.onclick = () => {
            playSuccessSound();
            speakVietnamese(`Chào bé ngoan! Mình là ${pet.name} đây!`);
          };
        }
        grid.appendChild(card);
      });
      stage.innerHTML = '';
      stage.appendChild(grid);
    }

    function handleAnswerSubmit(selectedNum) {
      const q = state.currentQuestion;
      if (!q) return;

      if (selectedNum === q.answer) {
        state.stars += 1;
        state.streak += 1;
        localStorage.setItem('toan1_stars', String(state.stars));
        playSuccessSound();
        launchConfetti();

        const msg = `Đúng rồi! Là số ${selectedNum}. Bé giỏi lắm!`;
        document.getElementById('feedback-text').textContent = `🌟 ${msg}`;
        speakVietnamese(msg);
        setTimeout(() => generateQuestion(), 1600);
      } else {
        state.streak = 0;
        playGentleRetrySound();
        const retry = `Chưa phải số ${selectedNum}, bé đếm lại các bạn trên hình nhé!`;
        document.getElementById('feedback-text').textContent = `💡 ${retry}`;
        speakVietnamese(retry);
      }
    }

    function switchMode(newMode) {
      state.mode = newMode;
      ['count', 'tenframe', 'bond', 'pets'].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        btn.className =
          m === newMode
            ? 'btn-bounce px-2.5 py-1 rounded-lg font-black text-xs sm:text-sm bg-pink-500 text-white shadow shrink-0'
            : 'btn-bounce px-2.5 py-1 rounded-lg font-black text-xs sm:text-sm text-pink-700 bg-pink-50 shrink-0';
      });
      if (newMode === 'pets') renderWorkspace();
      else generateQuestion();
    }

    function nextQuestion() {
      generateQuestion();
    }

    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = Array.from({ length: 35 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() - 0.8) * 14,
        size: Math.random() * 7 + 5,
        color: ['#ec4899', '#f59e0b', '#8b5cf6', '#10b981', '#3b82f6'][Math.floor(Math.random() * 5)]
      }));
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.45;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (++frame < 35) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    renderNumpad();
    generateQuestion();
  </script>
</body>
