<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Toán Của Gấu" />
  <title>Toán Lớp 1 Của Gấu </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; 
      font-family: 'Nunito', sans-serif; 
      background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    
    /* Hiệu ứng Nút 3D Bubbly */
    .btn-3d {
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .btn-3d:active {
      transform: translateY(4px);
      border-bottom-width: 0px !important;
      margin-top: 4px;
    }
    
    /* Bảng gỗ (Wood Sign) */
    .wood-sign {
      background: #b45309;
      border: 4px solid #78350f;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 20px;
    }

    /* Bảng Trắng nổi (White Board) */
    .board-3d {
      background: #ffffff;
      border: 4px solid #f1f5f9;
      box-shadow: 0 12px 24px -6px rgba(0,0,0,0.1), 0 8px 12px -6px rgba(0,0,0,0.05), inset 0 -6px 0 rgba(0,0,0,0.03);
      border-radius: 32px;
    }

    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes floatBaby { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .animate-pop { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-float { animation: floatBaby 3s ease-in-out infinite; }
  </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-4">

  <!-- MÀN HÌNH 1: BẢNG THÀNH TÍCH (DASHBOARD) -->
  <div id="dashboard-view" class="w-full max-w-5xl h-full flex flex-col relative animate-pop">
    
    <!-- Tiêu đề Gỗ -->
    <div class="absolute -top-2 left-1/2 -translate-x-1/2 z-20">
      <div class="wood-sign px-6 sm:px-12 py-2 text-center relative">
        <div class="absolute -left-3 -top-2 text-3xl animate-spin" style="animation-duration: 4s;">✨</div>
        <div class="absolute -right-3 -bottom-2 text-3xl animate-spin" style="animation-duration: 3s;">✨</div>
        <h1 class="text-xl sm:text-4xl font-black text-amber-100 uppercase tracking-wide drop-shadow-md">Thành Tích Của Gấu</h1>
      </div>
    </div>

    <!-- Khung chính Dashboard -->
    <div class="flex-1 board-3d mt-8 sm:mt-10 p-3 sm:p-5 flex flex-col sm:flex-row gap-4 overflow-hidden relative">
      
      <!-- Cột Trái: Mascot & Nút Bắt đầu -->
      <div class="w-full sm:w-1/3 bg-gradient-to-b from-sky-100 to-indigo-50 rounded-[2rem] border-4 border-white flex flex-col items-center justify-center p-4 relative shadow-inner shrink-0">
        <div class="absolute top-4 left-4 bg-white/80 px-3 py-1.5 rounded-2xl shadow-sm text-sm font-black text-indigo-600 flex items-center gap-2">
          <span>Giỏi quá!</span>💖
        </div>
        <div class="text-7xl sm:text-9xl animate-float mt-6">🐻</div>
        <div class="text-center mt-4 mb-6">
          <h2 class="text-xl font-black text-slate-800">Gấu Ngoan</h2>
          <p class="text-sm font-bold text-slate-500">Tiến bộ mỗi ngày</p>
        </div>
        
        <button onclick="startMathGame('addition')" class="btn-3d w-full bg-emerald-500 border-b-[6px] border-emerald-700 text-white text-xl sm:text-2xl font-black py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
          <span>▶️</span> Học Tiếp Lớp 1
        </button>
      </div>

      <!-- Cột Phải: Thống kê & Huy hiệu -->
      <div class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1">
        
        <div class="grid grid-cols-2 gap-3 shrink-0">
          <!-- Card Sao -->
          <div class="bg-amber-50 rounded-[2rem] p-4 border-2 border-amber-200 flex items-center justify-center gap-4">
            <div class="text-5xl drop-shadow-md">⭐</div>
            <div class="text-center">
              <div class="text-sm font-bold text-amber-700">Sao thưởng</div>
              <div id="dash-stars" class="text-4xl sm:text-5xl font-black text-amber-500 leading-none">0</div>
            </div>
          </div>
          
          <!-- Card Bài học -->
          <div class="bg-blue-50 rounded-[2rem] p-4 border-2 border-blue-200 flex items-center justify-center gap-4">
            <div class="text-center">
              <div class="text-sm font-bold text-blue-700">Bài SGK</div>
              <div class="text-3xl sm:text-4xl font-black text-blue-500 leading-none">Bài 10</div>
            </div>
            <div class="text-5xl drop-shadow-md">📚</div>
          </div>
        </div>

        <!-- Mục tiêu -->
        <div class="bg-emerald-50 rounded-[2rem] p-4 border-2 border-emerald-200 shrink-0">
          <div class="flex justify-between items-end mb-2">
            <div class="font-black text-emerald-800 flex items-center gap-2"><span class="text-xl">🎯</span> Chinh phục phép cộng</div>
            <div class="text-sm font-bold text-emerald-600">Đang học</div>
          </div>
          <div class="w-full h-4 bg-emerald-200 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full w-1/3 relative overflow-hidden">
              <div class="absolute top-0 left-0 w-full h-full bg-white/30 skew-x-12"></div>
            </div>
          </div>
        </div>

        <!-- Huy hiệu -->
        <div class="bg-pink-50 rounded-[2rem] p-4 border-2 border-pink-200 flex-1 min-h-[140px] flex flex-col">
          <div class="font-black text-pink-800 mb-3 flex items-center gap-2"><span class="text-xl">🎁</span> Huy hiệu của Gấu</div>
          <div class="flex gap-3 overflow-x-auto pb-2 flex-1 items-center">
            <div class="flex flex-col items-center gap-1 opacity-100 shrink-0"><div class="w-16 h-16 bg-white rounded-2xl border-4 border-amber-300 shadow flex items-center justify-center text-3xl">🐾</div><span class="text-[10px] font-bold text-slate-500">Biết Đếm</span></div>
            <div class="flex flex-col items-center gap-1 opacity-100 shrink-0"><div class="w-16 h-16 bg-white rounded-2xl border-4 border-sky-300 shadow flex items-center justify-center text-3xl">⚖️</div><span class="text-[10px] font-bold text-slate-500">So Sánh</span></div>
            <div class="flex flex-col items-center gap-1 opacity-40 shrink-0"><div class="w-16 h-16 bg-slate-200 rounded-2xl border-4 border-slate-300 shadow-inner flex items-center justify-center text-3xl grayscale">➕</div><span class="text-[10px] font-bold text-slate-500">Phép Cộng</span></div>
            <div class="flex flex-col items-center gap-1 opacity-40 shrink-0"><div class="w-16 h-16 bg-slate-200 rounded-2xl border-4 border-slate-300 shadow-inner flex items-center justify-center text-3xl grayscale">➖</div><span class="text-[10px] font-bold text-slate-500">Phép Trừ</span></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- MÀN HÌNH 2: BÀI HỌC PHÉP CỘNG (GAMEPLAY) -->
  <div id="game-view" class="hidden w-full max-w-5xl h-full flex flex-col gap-3 animate-pop">
    
    <!-- Thanh Header Gameplay -->
    <header class="bg-white/80 backdrop-blur rounded-3xl p-2 border-4 border-white shadow-sm flex items-center justify-between shrink-0">
      <button onclick="goHome()" class="btn-3d w-12 h-12 bg-sky-400 border-b-4 border-sky-600 rounded-2xl text-white text-xl flex items-center justify-center shadow-md">
        ⬅️
      </button>
      
      <div class="bg-indigo-500 text-white px-6 py-2 rounded-2xl font-black border-b-4 border-indigo-700 shadow flex items-center gap-2 text-sm sm:text-lg">
        🚀 Bài 10: Phép Cộng
      </div>

      <div class="flex items-center gap-2">
        <div class="hidden sm:flex w-32 h-4 bg-slate-200 rounded-full overflow-hidden"><div id="game-progress" class="h-full bg-emerald-400" style="width: 20%"></div></div>
        <div class="bg-amber-400 text-amber-900 px-3 py-1.5 rounded-2xl font-black text-sm sm:text-lg border-b-4 border-amber-600 shadow flex items-center gap-1">
          ⭐ <span id="game-stars">0</span>
        </div>
      </div>
    </header>

    <!-- Khu vực Bảng Toán -->
    <main class="flex-1 board-3d p-4 flex flex-col relative bg-sky-50">
      <div class="text-center font-black text-sky-800 text-base sm:text-xl mb-4" id="game-prompt">
        Gấu hãy gộp lại và chọn đáp án đúng nhé!
      </div>

      <!-- Bảng phương trình trung tâm -->
      <div class="flex-1 flex items-center justify-center gap-2 sm:gap-6 mb-4">
        
        <!-- Khối Số 1 -->
        <div class="flex flex-col items-center gap-3">
          <div class="w-20 h-24 sm:w-28 sm:h-32 bg-pink-100 border-4 border-pink-300 rounded-[2rem] flex items-center justify-center shadow-inner">
            <span id="num1" class="text-5xl sm:text-7xl font-black text-pink-500">2</span>
          </div>
          <div id="visual1" class="flex flex-wrap justify-center w-24 gap-1 min-h-[40px]">
            <span class="text-2xl animate-float" style="animation-delay: 0.1s">🐶</span>
            <span class="text-2xl animate-float" style="animation-delay: 0.3s">🐶</span>
          </div>
        </div>

        <div class="text-4xl sm:text-6xl font-black text-slate-400 mt-[-40px]">+</div>

        <!-- Khối Số 2 -->
        <div class="flex flex-col items-center gap-3">
          <div class="w-20 h-24 sm:w-28 sm:h-32 bg-amber-100 border-4 border-amber-300 rounded-[2rem] flex items-center justify-center shadow-inner">
            <span id="num2" class="text-5xl sm:text-7xl font-black text-amber-500">3</span>
          </div>
          <div id="visual2" class="flex flex-wrap justify-center w-24 gap-1 min-h-[40px]">
            <span class="text-2xl animate-float" style="animation-delay: 0.2s">🐶</span>
            <span class="text-2xl animate-float" style="animation-delay: 0.4s">🐶</span>
            <span class="text-2xl animate-float" style="animation-delay: 0.6s">🐶</span>
          </div>
        </div>

        <div class="text-4xl sm:text-6xl font-black text-slate-400 mt-[-40px]">=</div>

        <!-- Khối Kết Quả (?) -->
        <div class="flex flex-col items-center gap-3">
          <div id="ans-box" class="w-24 h-28 sm:w-32 sm:h-36 bg-white border-4 border-dashed border-rose-300 rounded-[2rem] flex items-center justify-center shadow">
            <span class="text-6xl sm:text-8xl font-black text-rose-400 animate-pulse">?</span>
          </div>
          <div class="h-[40px] w-24"></div> <!-- Placeholder cho cân bằng -->
        </div>

      </div>

      <!-- Khu vực chọn đáp án (3 Nút to) -->
      <div id="answer-options" class="grid grid-cols-3 gap-3 sm:gap-6 px-4 sm:px-12 mb-4 shrink-0">
        <!-- Render bằng JS -->
      </div>

      <!-- Thanh Công Cụ Đáy -->
      <div class="flex justify-center gap-4 shrink-0">
        <button onclick="speakQuestion()" class="btn-3d bg-pink-400 border-b-[5px] border-pink-600 text-white font-black text-base sm:text-lg px-6 py-3 rounded-2xl shadow flex items-center gap-2">
          🔊 Nghe
        </button>
        <button onclick="showHint()" class="btn-3d bg-amber-400 border-b-[5px] border-amber-600 text-amber-900 font-black text-base sm:text-lg px-6 py-3 rounded-2xl shadow flex items-center gap-2">
          💡 Gợi ý
        </button>
      </div>
    </main>

  </div>

  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <script>
    const CHILD_NAME = 'Gấu';
    const EMOJIS = ['🐶', '🐱', '🐰', '🐼', '🍓', '🚗', '🎈', '⭐'];
    
    let stars = parseInt(localStorage.getItem('toan1_stars') || '0', 10);
    let currentQ = null;
    let audioCtx = null;
    const ttsPlayer = new Audio();

    function updateStars() {
      document.getElementById('dash-stars').textContent = stars;
      document.getElementById('game-stars').textContent = stars;
    }
    updateStars();

    // -- AUDIO ENGINE --
    function initAudio() {
      if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch(e){} }
      if (!audioCtx) audioCtx = new window.AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      initAudio();
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'pop') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'success') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function speakVietnamese(text) {
      if (!text) return;
      initAudio();
      const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=vi&q=${encodeURIComponent(text)}`;
      ttsPlayer.pause(); ttsPlayer.src = url;
      ttsPlayer.play().catch(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'vi-VN'; utter.rate = 0.95;
          window.speechSynthesis.speak(utter);
        }
      });
    }

    // -- NAVIGATION --
    function goHome() {
      playSound('pop');
      document.getElementById('game-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      updateStars();
    }

    function startMathGame(topic) {
      playSound('pop');
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('game-view').classList.remove('hidden');
      generateAdditionQuestion();
    }

    // -- ADDITION GAME LOGIC --
    function generateAdditionQuestion() {
      // Phép cộng phạm vi 10 (Bài 10 SGK)
      const sum = Math.floor(Math.random() * 8) + 3; // 3 đến 10
      const num1 = Math.floor(Math.random() * (sum - 1)) + 1; // Ít nhất là 1
      const num2 = sum - num1;
      const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      
      // Tạo 3 đáp án (1 đúng, 2 sai)
      let options = new Set([sum]);
      while(options.size < 3) {
        let wrong = sum + Math.floor(Math.random() * 5) - 2;
        if(wrong > 0 && wrong <= 15) options.add(wrong);
      }
      options = Array.from(options).sort(() => Math.random() - 0.5);

      currentQ = { num1, num2, sum, emoji, options };
      renderAdditionUI();
      
      setTimeout(() => speakQuestion(), 600);
    }

    function speakQuestion() {
      speakVietnamese(`${CHILD_NAME} ơi, ${currentQ.num1} cộng ${currentQ.num2} bằng mấy?`);
    }

    function showHint() {
      playSound('pop');
      speakVietnamese(`${CHILD_NAME} hãy đếm tất cả các hình ở bên dưới số nhé: 1, 2, 3...`);
    }

    function renderAdditionUI() {
      const q = currentQ;
      document.getElementById('num1').textContent = q.num1;
      document.getElementById('num2').textContent = q.num2;
      
      // Box kết quả reset
      const ansBox = document.getElementById('ans-box');
      ansBox.className = 'w-24 h-28 sm:w-32 sm:h-36 bg-white border-4 border-dashed border-rose-300 rounded-[2rem] flex items-center justify-center shadow transition-all';
      ansBox.innerHTML = '<span class="text-6xl sm:text-8xl font-black text-rose-400 animate-pulse">?</span>';

      // Sinh hình ảnh dưới số
      document.getElementById('visual1').innerHTML = Array(q.num1).fill(0).map((_,i) => `<span class="text-2xl sm:text-3xl animate-float" style="animation-delay: ${i*0.1}s">${q.emoji}</span>`).join('');
      document.getElementById('visual2').innerHTML = Array(q.num2).fill(0).map((_,i) => `<span class="text-2xl sm:text-3xl animate-float" style="animation-delay: ${(i+q.num1)*0.1}s">${q.emoji}</span>`).join('');

      // Nút đáp án (dùng các màu của ảnh mockup: Xanh dương, Xanh lá, Tím, Cam)
      const colors = [
        { bg: 'bg-blue-400', border: 'border-blue-600', text: 'text-white' },
        { bg: 'bg-emerald-500', border: 'border-emerald-700', text: 'text-white' },
        { bg: 'bg-purple-500', border: 'border-purple-700', text: 'text-white' }
      ];

      const optsContainer = document.getElementById('answer-options');
      optsContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const c = colors[idx];
        const btn = document.createElement('button');
        btn.className = `btn-3d ${c.bg} border-b-[6px] ${c.border} ${c.text} rounded-3xl py-4 sm:py-6 text-4xl sm:text-6xl font-black shadow-md flex items-center justify-center`;
        btn.textContent = opt;
        btn.onclick = () => submitAddition(opt);
        optsContainer.appendChild(btn);
      });
    }

    function submitAddition(selected) {
      if (selected === currentQ.sum) {
        playSound('success'); triggerConfetti();
        stars += 2; localStorage.setItem('toan1_stars', stars); updateStars();
        
        // Hiệu ứng điền số vào ô Kết quả
        const ansBox = document.getElementById('ans-box');
        ansBox.className = 'w-24 h-28 sm:w-32 sm:h-36 bg-rose-500 border-4 border-rose-600 rounded-[2rem] flex items-center justify-center shadow-lg animate-pop';
        ansBox.innerHTML = `<span class="text-6xl sm:text-8xl font-black text-white">${currentQ.sum}</span>`;

        speakVietnamese(`Giỏi quá! ${currentQ.num1} cộng ${currentQ.num2} bằng ${currentQ.sum}.`);
        setTimeout(() => generateAdditionQuestion(), 2500);
      } else {
        playSound('wrong');
        speakVietnamese(`Chưa đúng rồi, Gấu đếm cẩn thận lại tổng số hình ở bên dưới nhé!`);
      }
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas'); const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const pieces = Array.from({length: 40}, () => ({ x: canvas.width/2, y: canvas.height/2, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.8)*15, size: Math.random()*8+6, color: ['#ec4899','#f59e0b','#8b5cf6','#10b981','#3b82f6'][Math.floor(Math.random()*5)] }));
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.5; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
        if (++frame < 40) requestAnimationFrame(animate); else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }
  </script>
</body>
</html>
